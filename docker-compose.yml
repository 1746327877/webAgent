x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://webagent:${PG_PWD:-webagent}@postgres:5432/webagent
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789abcdef}
  UPLOAD_DIR: /data/uploads
  # 宿主机 MinerU 服务；留空则用内置解析（pymupdf/docx），不启用 OCR
  MINERU_API_URL: ${MINERU_API_URL:-}
  # pipeline 支持纯 CPU；hybrid/vlm 需要 CUDA
  MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
  # 联网搜索 MCP（compose 的 web-search 服务）；留空则输入框按钮禁用
  WEB_SEARCH_MCP_URL: ${WEB_SEARCH_MCP_URL:-http://web-search:3000/mcp}
  # OCR MCP（部署方自备服务）；留空则图片回合不挂 OCR 工具
  OCR_MCP_URL: ${OCR_MCP_URL:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: webagent
      POSTGRES_USER: webagent
      POSTGRES_PASSWORD: ${PG_PWD:-webagent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webagent -d webagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_all && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: ./backend
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # 宿主端口可配置：8080 常被 Steam（CEF 调试端口）/其他程序占用，
      # 浏览器访问 localhost 时 IPv4 优先会落到那些进程上，故默认改用 8090
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy

  # 联网搜索 MCP（open-websearch，Node/TypeScript 实现）。
  # 后端在容器内用 http://web-search:3000/mcp 访问（容器网络内部端口固定 3000）；
  # 宿主机测试 / 本地开发模式用 http://localhost:${WEB_SEARCH_PORT:-3300}/mcp
  # （默认宿主端口避开 Windows 保留段 2929-3028）
  web-search:
    image: ghcr.io/aas-ee/open-web-search:latest
    environment:
      MODE: http
      PORT: "3000"
      DEFAULT_SEARCH_ENGINE: ${WEB_SEARCH_ENGINE:-bing}
    ports:
      - "${WEB_SEARCH_PORT:-3300}:3000"

volumes:
  pgdata:
  uploads:
