services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: webagent
      POSTGRES_USER: webagent
      POSTGRES_PASSWORD: webagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webagent -d webagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
